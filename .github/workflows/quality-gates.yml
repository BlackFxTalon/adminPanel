name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Test-only seed values; production secrets are never stored in this repository.
      AUTH_JWT_SECRET: ci-quality-gates-secret-with-32-characters
      AUTH_TEST_ADMIN_EMAIL: ci-admin@example.invalid
      AUTH_TEST_ADMIN_PASSWORD: ci-admin-password
      AUTH_TEST_USER_EMAIL: ci-user@example.invalid
      AUTH_TEST_USER_PASSWORD: ci-user-password
      NUXT_PUBLIC_ORDERS_DATA_MODE: http
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: pnpm

      - name: Install dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm run build:shared

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: API integration and unit tests (disposable PostgreSQL)
        run: pnpm run test:api

      - name: Web unit tests
        run: pnpm run test:web-unit

      - name: Web component tests
        run: pnpm run test:web-component

      - name: Build API
        run: pnpm run build:api

      - name: Build web
        run: pnpm run build:web

      - name: End-to-end Orders journey (Playwright against the production build)
        run: pnpm run test:e2e
